<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#123B63">
<title>Leitura - Imóveis Vagos</title>
<style>
:root{--azul:#123B63;--azul-esc:#0B2945;--borda:#c5cfd8;--texto:#1f2937;--suave:#667085}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#eef2f6;color:var(--texto);font-size:14px;-webkit-text-size-adjust:100%}
header{background:var(--azul);color:#fff;text-align:center;padding:12px;padding-top:calc(12px + env(safe-area-inset-top,0px));font-weight:700;font-size:16px}
main{max-width:700px;margin:auto;padding:10px}
.card{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 5px rgba(0,0,0,.07)}
h2{font-size:16px;margin:0 0 4px}
.help{font-size:12px;color:var(--suave);margin-bottom:6px}
label{display:block;font-weight:600;font-size:13px;margin:10px 0 4px}
input[type=text],input[type=date],select{display:block;width:100%;min-width:0;height:40px;border:1px solid var(--borda);border-radius:8px;padding:0 10px;font-size:15px;background:#fff;color:var(--texto);font-family:inherit}
input[type=date]{-webkit-appearance:none;appearance:none;text-align:left;line-height:40px}
input[type=date]::-webkit-date-and-time-value{text-align:left}
input:focus,select:focus{outline:none;border-color:var(--azul);box-shadow:0 0 0 2px rgba(18,59,99,.15)}
input:disabled{opacity:.45}
.stage-select{height:44px;border:2px solid var(--azul);border-radius:10px;font-weight:700}
.linha{display:grid;grid-template-columns:minmax(0,1fr) 88px;gap:8px}
.reading-row{display:none}
.vacant-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0 4px}
.vacant-row label{margin:0;font-size:14px;cursor:pointer}
.vacant-checkbox{-webkit-appearance:none;appearance:none;flex:0 0 28px;width:28px;height:28px;margin:0;border:2px solid var(--azul);border-radius:6px;background:#fff;position:relative;cursor:pointer}
.vacant-checkbox:checked{background:var(--azul)}
.vacant-checkbox:checked::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:900}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:40px;margin:0;border:0;border-radius:8px;font-size:14px;font-weight:700;background:var(--azul);color:#fff;cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent}
.btn:active{background:var(--azul-esc)}
.btn.red{background:#b42318}
.btn.claro{background:#e6ecf2;color:var(--azul)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.escondido{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
#photoList{display:grid;gap:10px;margin-top:10px}
.foto-img{display:block;width:100%;max-height:260px;object-fit:contain;background:#e5e7eb;border-radius:8px 8px 0 0}
.foto-legenda{background:rgba(0,0,0,.72);color:#fff;font-weight:700;font-size:13px;padding:6px 10px;border-radius:0 0 8px 8px;margin-bottom:6px}
#cropPanel{display:none;margin-top:10px}
#cropCanvas{width:100%;border:2px solid var(--azul);border-radius:8px;touch-action:none;background:#222}
.saved-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0 10px}
#recordsFilter{font-size:12px;color:var(--suave)}
#showAll{width:auto;height:32px;padding:0 14px;font-size:13px}
.acoes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:10px}
.acoes .btn{height:46px;font-size:20px}
.record{border-top:1px solid #e5e7eb;padding:10px 0;font-size:13px}
.record:first-child{border-top:0}
.record b.tit{font-size:14px}
.tag{display:inline-block;background:#e6ecf2;color:var(--azul);padding:3px 7px;border-radius:10px;font-size:11px;font-weight:700;margin:3px 3px 3px 0}
.record img{width:100%;max-height:240px;object-fit:contain;border-radius:8px;background:#e5e7eb;display:block}
.record .btn{margin-top:8px;height:36px}
#import{margin-top:8px;font-size:13px;width:100%}
footer{text-align:center;padding:8px 12px calc(20px + env(safe-area-inset-bottom,0px));color:var(--suave);font-size:11px;line-height:1.5}
#appUpdateBtn{margin-top:10px;height:36px;font-size:13px}
</style>
</head>
<body>
<header>Leitura - Imóveis Vagos</header>
<main>

<section class="card">
  <h2>Etapa da leitura</h2>
  <div class="help">Selecione uma etapa:</div>
  <select id="stageSelect" class="stage-select" aria-label="Selecione a etapa da leitura">
    <option value="">Selecione a etapa</option>
  </select>

  <div class="linha">
    <div>
      <label for="endereco">Endereço</label>
      <input id="endereco" type="text" placeholder="Ex.: Rua 11" autocomplete="off">
    </div>
    <div>
      <label for="numero">Número</label>
      <input id="numero" type="text" inputmode="numeric" placeholder="Nº" autocomplete="off">
    </div>
  </div>

  <label for="medidor">Número do medidor</label>
  <input id="medidor" type="text" placeholder="Digite o número do medidor" autocomplete="off">

  <div id="readingsList"></div>

  <label for="data">Data</label>
  <input id="data" type="date">

  <div class="vacant-row">
    <label for="vacant">Imóvel desocupado</label>
    <input id="vacant" type="checkbox" class="vacant-checkbox">
  </div>

  <label>Fotos do medidor</label>
  <input id="cameraInput" class="escondido" type="file" accept="image/*" capture="environment">
  <input id="galleryInput" class="escondido" type="file" accept="image/*" multiple>
  <div class="grid2" style="margin-top:0">
    <label for="cameraInput" class="btn" style="margin:0">📷 Câmera</label>
    <label for="galleryInput" class="btn" style="margin:0">🖼️ Galeria</label>
  </div>

  <div id="photoList"></div>
  <div id="photoTools" class="grid2" style="display:none">
    <button id="cropBtn" type="button" class="btn claro">✂️ Recortar última</button>
    <button id="shareBtn" type="button" class="btn">📤 Compartilhar</button>
  </div>

  <div id="cropPanel">
    <div style="font-weight:700;font-size:13px;margin-bottom:6px">Arraste na foto para escolher o recorte</div>
    <canvas id="cropCanvas"></canvas>
    <div class="grid2">
      <button id="applyCrop" type="button" class="btn">Aplicar</button>
      <button id="cancelCrop" type="button" class="btn claro">Cancelar</button>
    </div>
  </div>
</section>

<section class="card">
  <h2>Registros salvos</h2>
  <div class="saved-top">
    <span id="recordsFilter">Selecione uma etapa para ver seus registros.</span>
    <button id="showAll" type="button" class="btn">Todos</button>
  </div>
  <div class="acoes">
    <button type="button" id="cleanShareBtn" class="btn" title="Compartilhar fotos" aria-label="Compartilhar fotos">📎</button>
    <button type="button" id="save" class="btn" title="Salvar" aria-label="Salvar">💾</button>
    <button type="button" id="clear" class="btn" title="Limpar formulário" aria-label="Limpar formulário">🗑️</button>
    <button type="button" id="shareAppBtn" class="btn" title="Compartilhar aplicativo" aria-label="Compartilhar aplicativo">📲</button>
  </div>
  <div id="records"></div>
</section>

<section class="card">
  <h2>Backup</h2>
  <button id="export" type="button" class="btn" style="margin-top:6px">Exportar backup</button>
  <input id="import" type="file" accept=".json,application/json">
</section>

</main>
<footer>
  Desenvolvido por Luís Ricardo de Almeida Siqueira<br>
  © 2026 Luís Ricardo de Almeida Siqueira — Todos os direitos reservados.
  <button id="appUpdateBtn" type="button" class="btn">🔄 Atualizar aplicativo</button>
</footer>

<script>
(function(){
"use strict";

var ETAPAS="app_etapas_v4", REGISTROS="app_registros_v4", NUM_LEITURAS=10;
var etapaAtual=0, dadosEtapas={}, registros=[], fotosAtuais=[], leiturasAtuais=[""], desocupado=false, mostrarTodos=false;
var cacheShare=null;

function $(id){return document.getElementById(id);}
var stageSelect=$("stageSelect"), endereco=$("endereco"), numero=$("numero"), medidor=$("medidor"),
    data=$("data"), vacant=$("vacant"), records=$("records"), readingsList=$("readingsList"),
    photoList=$("photoList"), photoTools=$("photoTools"), cameraInput=$("cameraInput"),
    galleryInput=$("galleryInput"), cropPanel=$("cropPanel"), cropCanvas=$("cropCanvas");

/* Monta etapas e campos de leitura */
for(var e=1;e<=18;e++){
  var o=document.createElement("option"); o.value=e; o.textContent="Etapa "+e; stageSelect.appendChild(o);
}
for(var k=0;k<NUM_LEITURAS;k++){
  var row=document.createElement("div"); row.className="reading-row";
  row.innerHTML='<label for="leituraCampo'+k+'">Leitura '+(k+1)+'</label>'+
    '<input id="leituraCampo'+k+'" type="text" inputmode="decimal" placeholder="Digite a leitura" autocomplete="off">';
  readingsList.appendChild(row);
}

function hoje(){
  var d=new Date(); function z(n){return n<10?"0"+n:n;}
  return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate());
}
function gravar(chave,valor){
  try{localStorage.setItem(chave,JSON.stringify(valor));return true;}catch(err){return false;}
}
function cheio(v){return String(v||"").trim()!=="";}

/* Texto que vai na foto: "Rua 11, nº 15" */
function textoEndereco(){
  var t=endereco.value.trim(), n=numero.value.trim();
  if(n) t+=(t?", ":"")+"nº "+n;
  return t;
}

function guardarEtapaAtual(){
  if(!etapaAtual)return;
  dadosEtapas[String(etapaAtual)]={
    endereco:endereco.value, numero:numero.value, medidor:medidor.value,
    leituras:leiturasAtuais.slice(), leitura:leiturasAtuais[0]||"",
    data:data.value, desocupado:desocupado,
    fotos:fotosAtuais.slice(), foto:fotosAtuais[0]||null
  };
  if(!gravar(ETAPAS,dadosEtapas)){
    /* Sem espaço para o rascunho com fotos: guarda só os textos */
    var copia=JSON.parse(JSON.stringify(dadosEtapas));
    Object.keys(copia).forEach(function(k){copia[k].fotos=[];copia[k].foto=null;});
    gravar(ETAPAS,copia);
  }
}

/* LEITURAS */
function atualizarLeituras(){
  for(var j=0;j<NUM_LEITURAS;j++){
    var inp=$("leituraCampo"+j);
    var visivel=j===0 || (!desocupado && cheio(leiturasAtuais[j-1])) || cheio(leiturasAtuais[j]);
    inp.parentNode.style.display=visivel?"block":"none";
    inp.disabled=desocupado;
  }
}
function preencherLeituras(){
  for(var j=0;j<NUM_LEITURAS;j++) $("leituraCampo"+j).value=leiturasAtuais[j]||"";
  atualizarLeituras();
}
readingsList.addEventListener("input",function(ev){
  var idx=Number(String(ev.target.id).replace("leituraCampo",""));
  if(isNaN(idx))return;
  leiturasAtuais[idx]=ev.target.value;
  atualizarLeituras();
  guardarEtapaAtual();
});

/* FOTOS */
function atualizarLegendas(){
  var t=textoEndereco()||"Digite endereço e número para sair na foto";
  photoList.querySelectorAll(".foto-legenda").forEach(function(el){el.textContent="📍 "+t;});
  cacheShare=null;
}
function renderFotos(){
  photoList.innerHTML="";
  cacheShare=null;
  photoTools.style.display=fotosAtuais.length?"grid":"none";
  fotosAtuais.forEach(function(src,i){
    var box=document.createElement("div");
    var img=document.createElement("img");
    img.className="foto-img"; img.src=src; img.alt="Foto do medidor "+(i+1);
    var leg=document.createElement("div"); leg.className="foto-legenda";
    var del=document.createElement("button");
    del.type="button"; del.className="btn red"; del.textContent="🗑️ Excluir foto "+(i+1);
    del.addEventListener("click",function(){
      fotosAtuais.splice(i,1); renderFotos(); guardarEtapaAtual();
    });
    box.appendChild(img); box.appendChild(leg); box.appendChild(del);
    photoList.appendChild(box);
  });
  atualizarLegendas();
}

/* Reduz a foto para não lotar a memória do celular */
function reduzirImagem(src,max,cb){
  var img=new Image();
  img.onload=function(){
    var s=Math.min(1,max/img.width,max/img.height);
    var c=document.createElement("canvas");
    c.width=Math.max(1,Math.round(img.width*s)); c.height=Math.max(1,Math.round(img.height*s));
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    cb(c.toDataURL("image/jpeg",.85));
  };
  img.onerror=function(){cb(null);};
  img.src=src;
}

function lerFotos(input){
  if(!etapaAtual){alert("Selecione primeiro uma etapa de 1 a 18.");input.value="";return;}
  var arquivos=Array.prototype.slice.call(input.files||[]).filter(function(f){return f.type.indexOf("image/")===0;});
  input.value="";
  if(!arquivos.length)return;
  var i=0;
  (function proxima(){
    if(i>=arquivos.length){renderFotos();guardarEtapaAtual();return;}
    var url=URL.createObjectURL(arquivos[i]);
    reduzirImagem(url,1600,function(res){
      URL.revokeObjectURL(url);
      if(res)fotosAtuais.push(res); else alert("Não foi possível abrir uma das fotos.");
      i++; proxima();
    });
  })();
}
cameraInput.addEventListener("change",function(){lerFotos(cameraInput);});
galleryInput.addEventListener("change",function(){lerFotos(galleryInput);});

/* Escreve o endereço na parte de baixo da foto */
function quebrarTexto(ctx,texto,maxW){
  var palavras=texto.split(" "), linhas=[], atual="";
  palavras.forEach(function(p){
    var teste=atual?atual+" "+p:p;
    if(ctx.measureText(teste).width>maxW && atual){linhas.push(atual);atual=p;}
    else atual=teste;
  });
  if(atual)linhas.push(atual);
  return linhas;
}
function carimbar(src,texto,cb){
  if(!texto){cb(src);return;}
  var img=new Image();
  img.onload=function(){
    var c=document.createElement("canvas");
    c.width=img.width; c.height=img.height;
    var ctx=c.getContext("2d");
    ctx.drawImage(img,0,0);
    var fs=Math.max(20,Math.round(c.width/18)), pad=Math.round(fs*.55);
    ctx.font="bold "+fs+"px Arial";
    var linhas=quebrarTexto(ctx,texto,c.width-pad*2);
    var lh=Math.round(fs*1.25), h=linhas.length*lh+pad*2;
    ctx.fillStyle="rgba(0,0,0,.68)";
    ctx.fillRect(0,c.height-h,c.width,h);
    ctx.fillStyle="#fff"; ctx.textBaseline="top";
    linhas.forEach(function(l,i){ctx.fillText(l,pad,c.height-h+pad+i*lh+Math.round((lh-fs)/2));});
    cb(c.toDataURL("image/jpeg",.88));
  };
  img.onerror=function(){cb(src);};
  img.src=src;
}
function carimbarTodas(lista,texto,cb){
  var saida=[],i=0;
  (function prox(){
    if(i>=lista.length){cb(saida);return;}
    carimbar(lista[i],texto,function(r){saida.push(r);i++;prox();});
  })();
}
function dataUrlParaBlob(d){
  var partes=d.split(","), bin=atob(partes[1]), arr=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:"image/jpeg"});
}
function baixar(blob,nome){
  var u=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=u; a.download=nome; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){URL.revokeObjectURL(u);},1500);
}

/* COMPARTILHAR FOTOS (já com o endereço escrito) */
function enviar(pacote){
  if(navigator.share){
    var pode=true;
    try{ if(navigator.canShare) pode=navigator.canShare({files:pacote.arquivos}); }catch(err){pode=false;}
    if(pode){
      navigator.share({title:pacote.titulo,text:pacote.texto,files:pacote.arquivos})
      .then(function(){cacheShare=null;})
      .catch(function(err){
        if(err && err.name==="NotAllowedError"){
          cacheShare=pacote;
          alert("Fotos prontas. Toque em compartilhar de novo.");
        }
      });
      return;
    }
  }
  pacote.arquivos.forEach(function(f){baixar(f,f.name);});
}
function compartilharFotos(){
  if(!fotosAtuais.length){alert("Não há foto para compartilhar.");return;}
  if(cacheShare){enviar(cacheShare);return;}
  var texto=textoEndereco()||("Etapa "+etapaAtual);
  carimbarTodas(fotosAtuais,texto,function(prontas){
    var base=(texto.replace(/[^\wÀ-ú]+/g,"-").replace(/^-|-$/g,"")||"medidor");
    var arquivos=prontas.map(function(d,i){
      return new File([dataUrlParaBlob(d)],base+(prontas.length>1?"-"+(i+1):"")+".jpg",{type:"image/jpeg"});
    });
    enviar({titulo:"Medidor - "+texto,texto:texto,arquivos:arquivos});
  });
}
$("shareBtn").addEventListener("click",compartilharFotos);
$("cleanShareBtn").addEventListener("click",compartilharFotos);

/* RECORTE */
var cropImg=null,cx=0,cy=0,cw=0,ch=0,arrastando=false;
$("cropBtn").addEventListener("click",function(){
  if(!fotosAtuais.length){alert("Primeiro tire ou escolha uma foto.");return;}
  cropImg=new Image();
  cropImg.onload=function(){
    var s=Math.min(1,1200/cropImg.width,1200/cropImg.height);
    cropCanvas.width=Math.max(1,Math.round(cropImg.width*s));
    cropCanvas.height=Math.max(1,Math.round(cropImg.height*s));
    cx=cy=cw=ch=0; desenharRecorte();
    cropPanel.style.display="block";
  };
  cropImg.src=fotosAtuais[fotosAtuais.length-1];
});
function ponto(ev){
  var r=cropCanvas.getBoundingClientRect(), t=ev.touches?ev.touches[0]:ev;
  return {
    x:Math.max(0,Math.min(cropCanvas.width,(t.clientX-r.left)*cropCanvas.width/r.width)),
    y:Math.max(0,Math.min(cropCanvas.height,(t.clientY-r.top)*cropCanvas.height/r.height))
  };
}
function retangulo(){
  return {x:cw<0?cx+cw:cx, y:ch<0?cy+ch:cy, w:Math.abs(cw), h:Math.abs(ch)};
}
function desenharRecorte(){
  if(!cropImg)return;
  var ctx=cropCanvas.getContext("2d"), r=retangulo();
  ctx.clearRect(0,0,cropCanvas.width,cropCanvas.height);
  ctx.drawImage(cropImg,0,0,cropCanvas.width,cropCanvas.height);
  if(r.w>2&&r.h>2){
    ctx.fillStyle="rgba(0,0,0,.45)"; ctx.fillRect(0,0,cropCanvas.width,cropCanvas.height);
    var sx=cropImg.width/cropCanvas.width, sy=cropImg.height/cropCanvas.height;
    ctx.drawImage(cropImg,r.x*sx,r.y*sy,r.w*sx,r.h*sy,r.x,r.y,r.w,r.h);
    ctx.strokeStyle="#fff"; ctx.lineWidth=3; ctx.strokeRect(r.x,r.y,r.w,r.h);
  }
}
function inicio(ev){ev.preventDefault();var p=ponto(ev);cx=p.x;cy=p.y;cw=ch=0;arrastando=true;}
function movimento(ev){if(!arrastando)return;ev.preventDefault();var p=ponto(ev);cw=p.x-cx;ch=p.y-cy;desenharRecorte();}
function fim(){arrastando=false;}
cropCanvas.addEventListener("mousedown",inicio);
cropCanvas.addEventListener("mousemove",movimento);
window.addEventListener("mouseup",fim);
cropCanvas.addEventListener("touchstart",inicio,{passive:false});
cropCanvas.addEventListener("touchmove",movimento,{passive:false});
cropCanvas.addEventListener("touchend",fim);
$("applyCrop").addEventListener("click",function(){
  var r=retangulo();
  if(r.w<10||r.h<10){alert("Arraste sobre a foto para selecionar o recorte.");return;}
  var sx=cropImg.width/cropCanvas.width, sy=cropImg.height/cropCanvas.height;
  var c=document.createElement("canvas");
  c.width=Math.max(1,Math.round(r.w*sx)); c.height=Math.max(1,Math.round(r.h*sy));
  c.getContext("2d").drawImage(cropImg,r.x*sx,r.y*sy,r.w*sx,r.h*sy,0,0,c.width,c.height);
  fotosAtuais[fotosAtuais.length-1]=c.toDataURL("image/jpeg",.9);
  cropPanel.style.display="none";
  renderFotos(); guardarEtapaAtual();
});
$("cancelCrop").addEventListener("click",function(){cropPanel.style.display="none";});

/* ETAPA E CAMPOS */
function carregarEtapa(n){
  etapaAtual=n;
  var d=dadosEtapas[String(n)]||{};
  endereco.value=d.endereco||""; numero.value=d.numero||""; medidor.value=d.medidor||"";
  leiturasAtuais=Array.isArray(d.leituras)?d.leituras.slice():(d.leitura?[d.leitura]:[""]);
  data.value=d.data||hoje();
  desocupado=d.desocupado===true; vacant.checked=desocupado;
  fotosAtuais=Array.isArray(d.fotos)?d.fotos.slice():(d.foto?[d.foto]:[]);
  preencherLeituras(); renderFotos();
}
stageSelect.addEventListener("change",function(){
  var n=Number(this.value); if(!n)return;
  guardarEtapaAtual(); carregarEtapa(n);
  mostrarTodos=false; render();
});
vacant.addEventListener("change",function(){
  desocupado=vacant.checked; atualizarLeituras(); guardarEtapaAtual();
});
[endereco,numero].forEach(function(el){
  el.addEventListener("input",function(){atualizarLegendas();guardarEtapaAtual();});
});
medidor.addEventListener("input",guardarEtapaAtual);
data.addEventListener("change",guardarEtapaAtual);

/* SALVAR (as fotos ficam gravadas com o endereço escrito) */
$("save").addEventListener("click",function(){
  if(!etapaAtual){alert("Selecione uma etapa de 1 a 18.");return;}
  if(!endereco.value.trim()){alert("Digite o endereço.");return;}
  if(!medidor.value.trim()){alert("Digite o número do medidor.");return;}
  var leit=leiturasAtuais.filter(cheio);
  if(!desocupado && !leit.length){alert("Digite pelo menos uma leitura ou marque imóvel desocupado.");return;}
  guardarEtapaAtual();
  carimbarTodas(fotosAtuais,textoEndereco(),function(fotos){
    registros.unshift({
      id:Date.now(), etapa:etapaAtual, data:data.value,
      endereco:endereco.value.trim(), numero:numero.value.trim(), medidor:medidor.value.trim(),
      leituras:desocupado?[]:leit, leitura:desocupado?"":leit.join(" / "),
      desocupado:desocupado, fotos:fotos, foto:fotos[0]||null
    });
    if(!gravar(REGISTROS,registros)){
      registros.shift();
      alert("Memória do app cheia. Exporte o backup e exclua registros antigos para salvar mais.");
      return;
    }
    render();
    alert("Registro salvo.");
  });
});

/* LIMPAR */
$("clear").addEventListener("click",function(){
  if(!confirm("Limpar o formulário de todas as etapas? Os registros salvos continuam."))return;
  etapaAtual=0; dadosEtapas={}; fotosAtuais=[]; leiturasAtuais=[""]; desocupado=false;
  try{localStorage.removeItem(ETAPAS);}catch(err){}
  stageSelect.value=""; endereco.value=""; numero.value=""; medidor.value="";
  data.value=hoje(); vacant.checked=false;
  cropPanel.style.display="none";
  preencherLeituras(); renderFotos(); render();
});

/* REGISTROS */
function esc(v){
  return String(v==null?"":v).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
  });
}
function render(){
  var todos=mostrarTodos || !etapaAtual;
  var lista=todos?registros:registros.filter(function(r){return Number(r.etapa)===Number(etapaAtual);});
  $("recordsFilter").textContent=todos?"Todos os registros":"Registros da etapa "+etapaAtual;
  $("showAll").textContent=todos?"Etapa atual":"Todos";
  $("showAll").style.visibility=etapaAtual?"visible":"hidden";

  if(!lista.length){
    records.innerHTML='<span style="font-size:12px;color:#667085">'+
      (todos?"Nenhum registro salvo.":"Nenhum registro salvo nesta etapa.")+'</span>';
    return;
  }
  records.innerHTML="";
  lista.forEach(function(r){
    var fotos=(r.fotos&&r.fotos.length)?r.fotos:(r.foto?[r.foto]:[]);
    var leit=(r.leituras&&r.leituras.length)?r.leituras.join(" / "):r.leitura;
    var div=document.createElement("div");
    div.className="record";
    div.innerHTML=
      '<b class="tit">'+esc(r.endereco)+(r.numero?", nº "+esc(r.numero):"")+'</b><br>'+
      '<span class="tag">Etapa '+esc(r.etapa)+'</span>'+
      '<span class="tag">'+(r.data?esc(r.data.split("-").reverse().join("/")):"")+'</span>'+
      '<div>Medidor: <b>'+esc(r.medidor)+'</b></div>'+
      (r.desocupado?'<div><b>Imóvel desocupado</b></div>':
        '<div>Leitura'+((r.leituras&&r.leituras.length>1)?"s":"")+': <b>'+esc(leit)+'</b></div>')+
      (fotos.length?'<div style="display:grid;gap:8px;margin-top:8px">'+
        fotos.map(function(f,i){return '<img src="'+f+'" alt="Foto '+(i+1)+'">';}).join("")+'</div>':"")+
      '<button type="button" class="btn red" data-del="'+r.id+'">Excluir</button>';
    records.appendChild(div);
  });
  records.querySelectorAll("[data-del]").forEach(function(btn){
    btn.addEventListener("click",function(){
      if(!confirm("Excluir este registro?"))return;
      registros=registros.filter(function(r){return String(r.id)!==String(btn.dataset.del);});
      gravar(REGISTROS,registros); render();
    });
  });
}
$("showAll").addEventListener("click",function(){mostrarTodos=!mostrarTodos;render();});

/* BACKUP */
$("export").addEventListener("click",function(){
  var blob=new Blob([JSON.stringify({registros:registros,etapas:dadosEtapas})],{type:"application/json"});
  baixar(blob,"backup-imoveis-vagos.json");
});
$("import").addEventListener("change",function(ev){
  var f=ev.target.files[0]; if(!f)return;
  var leitor=new FileReader();
  leitor.onload=function(){
    try{
      var x=JSON.parse(leitor.result);
      registros=x.registros||[]; dadosEtapas=x.etapas||{};
      gravar(REGISTROS,registros); gravar(ETAPAS,dadosEtapas);
      render(); alert("Backup importado.");
    }catch(err){alert("Backup inválido.");}
    ev.target.value="";
  };
  leitor.readAsText(f);
});

/* COMPARTILHAR APLICATIVO */
$("shareAppBtn").addEventListener("click",function(){
  var url=window.location.href.split("?")[0];
  function copiar(){
    if(navigator.clipboard){
      navigator.clipboard.writeText(url).then(function(){alert("Link do aplicativo copiado.");},
        function(){prompt("Copie o link do aplicativo:",url);});
    }else prompt("Copie o link do aplicativo:",url);
  }
  if(navigator.share){
    navigator.share({title:"Leitura - Imóveis Vagos",text:"Abrir o aplicativo Leitura - Imóveis Vagos",url:url})
    .catch(function(err){if(!err||err.name!=="AbortError")copiar();});
  }else copiar();
});

/* ATUALIZAR APLICATIVO */
$("appUpdateBtn").addEventListener("click",function(){
  var u=new URL(window.location.href);
  u.searchParams.set("atualizado",Date.now().toString());
  window.location.replace(u.toString());
});

/* INÍCIO */
try{registros=JSON.parse(localStorage.getItem(REGISTROS)||"[]");}catch(err){registros=[];}
try{dadosEtapas=JSON.parse(localStorage.getItem(ETAPAS)||"{}");}catch(err){dadosEtapas={};}
data.value=hoje();
preencherLeituras();
render();

})();
</script>
</body>
</html>
